<body>

<button onclick="startVideo()">Play with sound</button>
<div id="player"></div>

<script>
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  var player;
  var START_TIME = 140;

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      height: '570',
      width: '1013',
      videoId: 'hXD2WG8UsyI',
      playerVars: {
        autoplay: 1,
        start: START_TIME,
        mute: 1
      },
      events: {
        onReady: function (e) {
          e.target.playVideo();
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) {
            player.seekTo(START_TIME, true);
            player.playVideo();
          }
        }
      }
    });
  };

  function startVideo() {
    player.unMute();
    player.playVideo();
  }
</script>

</body>
